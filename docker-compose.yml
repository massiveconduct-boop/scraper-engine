services:
  api:
    build: .
    command: uvicorn scraper_engine.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@pgbouncer:6432/scraper_engine
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
      - pgbouncer
      - minio
      - jaeger

  # worker-l1/l2/l3 are 3 replicas of the SAME worker pulling from ONE queue
  # ("scraper-jobs"), not per-level queues — Worker.process_job already runs
  # the full L1->L2->L3 escalation internally, per URL, in a single job. Three
  # separate rq workers just gives 3x horizontal concurrency on that one queue.
  worker-l1:
    build: .
    command: rq worker scraper-jobs
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@pgbouncer:6432/scraper_engine
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
      - pgbouncer
      - minio
      - jaeger

  worker-l2:
    build: .
    command: rq worker scraper-jobs
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@pgbouncer:6432/scraper_engine
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
      - pgbouncer
      - minio
      - jaeger

  worker-l3:
    build: .
    command: rq worker scraper-jobs
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@pgbouncer:6432/scraper_engine
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
      - pgbouncer
      - minio
      - jaeger

  proxy-harvester:
    build: .
    command: python -m scraper_engine.proxy.harvester_daemon
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@pgbouncer:6432/scraper_engine
    depends_on:
      - postgres
      - redis
      - jaeger

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scraper_engine
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scraper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgbouncer-init:
    image: postgres:16-alpine
    entrypoint: >
      sh -c "
        until pg_isready -h postgres -U scraper; do sleep 1; done;
        apk add --no-cache postgresql-client > /dev/null 2>&1;
        SCRAM=$$(psql -h postgres -U scraper -d scraper_engine -t -A -c \"SELECT rolpassword FROM pg_authid WHERE rolname='scraper'\");
        echo \"\\\"scraper\\\" \\\"$$SCRAM\\\"\" > /pgbouncer-config/userlist.txt;
        echo 'SCRAM userlist regenerated';
      "
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-scraper}
    depends_on:
      - postgres
    volumes:
      - pgbouncer_config:/pgbouncer-config

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: scraper
      DB_PASSWORD: ${POSTGRES_PASSWORD:-scraper}
      DB_NAME: scraper_engine
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - pgbouncer_config:/etc/pgbouncer-config:ro
    ports:
      - "6432:6432"
    depends_on:
      pgbouncer-init:
        condition: service_completed_successfully

  # Round 25: config/schema.py::PgBouncerConfig's pool fields have no code path
  # to affect the real pooler (it's configured entirely by pgbouncer.ini above);
  # this exporter is the actual fix for PgBouncerPoolNearLimit's dead metric —
  # it reads real pool state via SHOW POOLS/SHOW CONFIG (stats_users, added to
  # pgbouncer.ini above) rather than anything this app process could report.
  pgbouncer_exporter:
    image: prometheuscommunity/pgbouncer-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgres://scraper:${POSTGRES_PASSWORD:-scraper}@pgbouncer:6432/pgbouncer?sslmode=disable"
    ports:
      - "9127:9127"
    depends_on:
      - pgbouncer

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Real tracing backend — Jaeger's all-in-one image speaks OTLP gRPC natively
  # (no separate otel-collector needed). observability.otlp_endpoint points
  # every process here at it instead of the OTel default localhost:4317
  # (which resolves to the *calling container itself*, not this service).
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver

volumes:
  pgdata:
  miniodata:
  pgbouncer_config:
