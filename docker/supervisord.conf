; docker/supervisord.conf
;
; Runs api + the 3 self-healing daemons (proxy-harvester, dlq-reaper,
; webhook-sweeper) as one supervised container instead of 4 separate
; compose services an operator has to remember to start. Each program
; crash-restarts independently -- one daemon crash-looping never takes
; down the API or the other daemons.
;
; worker-l1/l2/l3 are NOT here -- they're the horizontally-scaled
; compute/browser workhorses, a different scaling unit, still separate
; compose services (see docker-compose.yml).

[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:api]
command=uvicorn scraper_engine.api.main:app --host 0.0.0.0 --port 8000 --no-server-header
directory=/app
priority=10
autostart=true
autorestart=true
startretries=10
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:proxy-harvester]
command=python -m scraper_engine.proxy.harvester_daemon
directory=/app
priority=20
autostart=true
autorestart=true
startretries=10
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:dlq-reaper]
command=python -m scraper_engine.proxy.dlq_reaper
directory=/app
priority=20
autostart=true
autorestart=true
startretries=10
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:webhook-sweeper]
command=python -m scraper_engine.orchestrator.webhook_sweeper
directory=/app
priority=20
autostart=true
autorestart=true
startretries=10
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
