; docker/supervisord.conf
;
; Runs api + the 5 self-healing daemons (proxy-harvester, dlq-reaper,
; webhook-sweeper, stuck-job-reaper, capacity-controller) as one supervised
; container instead of 6 separate compose services an operator has to
; remember to start. Each
; program crash-restarts independently -- one daemon crash-looping never
; takes down the API or the other daemons.
;
; worker-l1/l2/l3 are NOT here -- they're the horizontally-scaled
; compute/browser workhorses, a different scaling unit, still separate
; compose services (see docker-compose.yml).

; Round 62 -- startretries is 1000000, i.e. "never latch FATAL", not a
; real count. supervisord's default (3, previously 10 here) exists to
; stop a program that can never work from spinning forever; every
; program here CAN work, it just needs its dependencies up. During the
; outage in core/startup.py's docstring the API lost the start-order
; race to Postgres/MinIO 10 times in a row, went FATAL, and stayed dead
; for ~3 weeks after those dependencies recovered. The primary fix is
; core/startup.py (the API now waits rather than exiting, so it never
; burns a retry); this is the backstop for crash modes that fix does not
; cover -- an OOM kill, an import error from a half-rolled deploy.
; startsecs=5 still means a program has to stay up 5s to count as
; started, so a genuinely broken program is loud in the logs either way;
; it is just retried instead of abandoned.
[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:api]
command=uvicorn scraper_engine.api.main:app --host 0.0.0.0 --port 8000 --no-server-header
directory=/app
priority=10
autostart=true
autorestart=true
startretries=1000000
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:proxy-harvester]
command=python -m scraper_engine.proxy.harvester_daemon
directory=/app
priority=20
autostart=true
autorestart=true
startretries=1000000
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:dlq-reaper]
command=python -m scraper_engine.proxy.dlq_reaper
directory=/app
priority=20
autostart=true
autorestart=true
startretries=1000000
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


; Round 65 -- sizes the host-wide browser budget (host_capacity) from host
; CPU/memory pressure. Runs here because every container on a host reads
; the same host-wide PSI; a no-op tick while host_capacity is disabled.
[program:capacity-controller]
command=python -m scraper_engine.orchestrator.capacity_controller
directory=/app
priority=20
autostart=true
autorestart=true
startretries=1000000
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
