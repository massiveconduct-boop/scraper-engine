name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff mypy
      - run: ruff check . --exclude 'challenge-mirror' --exclude 'report-review-fix'
      - name: mypy ratchet (fails only on NEW errors beyond known baseline)
        run: |
          mypy core/ proxy/ orchestrator/ api/ storage/ --ignore-missing-imports >/tmp/mypy.out 2>&1 || true
          grep "^[^ ]*:[0-9]*: error:" /tmp/mypy.out | sort >/tmp/mypy-current.txt
          echo "=== Current mypy findings ===" && cat /tmp/mypy-current.txt
          echo "" && echo "=== Baseline (known, accepted) ===" && cat tools/mypy-baseline.txt
          sort tools/mypy-baseline.txt >/tmp/baseline-sorted.txt
          NEW=$(comm -13 /tmp/baseline-sorted.txt /tmp/mypy-current.txt)
          if [ -n "$NEW" ]; then
            echo "" && echo "NEW mypy errors detected (failing build):" && echo "$NEW"
            exit 1
          fi
          echo ""
          REMOVED=$(comm -23 /tmp/baseline-sorted.txt /tmp/mypy-current.txt)
          if [ -n "$REMOVED" ]; then
            echo "FIXED findings (update baseline):" && echo "$REMOVED"
          fi
          echo "mypy ratchet: no new errors — OK"

  unit:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: |
          pip install \
            fastapi uvicorn pydantic pydantic-core httpx scrapling \
            asyncpg redis rq camoufox structlog prometheus-client \
            pyyaml boto3 python-dotenv \
            pytest pytest-asyncio pytest-cov
          pip install -e . --no-deps
      - run: python -m pytest tests/unit/ -v --tb=short

  integration:
    runs-on: ubuntu-24.04
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scraper_engine
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: scraper
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@localhost:5432/scraper_engine
      REDIS_URL: redis://localhost:6379/0
      PGBOUNCER_DSN: postgresql://scraper:scraper@localhost:5432/scraper_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: |
          pip install \
            fastapi uvicorn pydantic pydantic-core httpx scrapling \
            asyncpg redis rq camoufox structlog prometheus-client \
            pyyaml boto3 python-dotenv fakeredis \
            pytest pytest-asyncio pytest-cov alembic sqlalchemy
          pip install -e . --no-deps
      - run: alembic upgrade head
      - run: python -m pytest tests/integration/ -v --tb=short --ignore=tests/integration/test_promotion.py

  chaos:
    runs-on: ubuntu-24.04
    needs: integration
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scraper_engine
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: scraper
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@localhost:5432/scraper_engine
      REDIS_URL: redis://localhost:6379/0
      PGBOUNCER_DSN: postgresql://scraper:scraper@localhost:5432/scraper_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: |
          pip install \
            fastapi uvicorn pydantic pydantic-core httpx scrapling \
            asyncpg redis rq camoufox structlog prometheus-client \
            pyyaml boto3 python-dotenv fakeredis \
            pytest pytest-asyncio pytest-cov alembic sqlalchemy
          pip install -e . --no-deps
      - run: alembic upgrade head
      - run: python -m pytest tests/chaos/ -v --tb=short --ignore=tests/chaos/test_pgbouncer_search_path_isolation.py
