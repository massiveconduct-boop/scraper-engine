name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # mypy --strict needs the real runtime deps installed to resolve types —
      # without pydantic/fastapi/redis, BaseModel/decorators/returns collapse to
      # Any and mypy emits spurious subclass/untyped-decorator/no-any-return
      # errors. requirements-dev-lock.txt is the single source of pinned
      # versions (round 28) — every job installs from it instead of
      # hand-listing packages, closing the 3-way-duplication drift that
      # caused the round-27 types-redis mismatch (operations.md #12).
      - run: pip install -r requirements-dev-lock.txt
      - name: requirements-lock.txt / requirements-dev-lock.txt match pyproject.toml (fail on drift)
        run: |
          pip install -q uv
          # --python-version 3.11 matches requires-python's floor (unit/integration/chaos
          # run a 3.11+3.12 matrix) — without it, uv resolves against whatever
          # interpreter compiled the lockfile and can pick a package version that
          # doesn't support the floor (numpy==2.5.1 requires >=3.12, broke the 3.11 job).
          uv pip compile pyproject.toml --python-version 3.11 --emit-index-url --no-header -o /tmp/check-lock.txt
          uv pip compile pyproject.toml --extra dev --python-version 3.11 --emit-index-url --no-header -o /tmp/check-dev-lock.txt
          diff requirements-lock.txt /tmp/check-lock.txt
          diff requirements-dev-lock.txt /tmp/check-dev-lock.txt
      - name: pip-audit (fail on known vulnerabilities)
        run: pip-audit -r requirements-lock.txt
      # challenge_mirror excluded here — linted separately against its own
      # committed baseline in the next step (same pattern as tools/mypy-baseline.txt).
      - run: ruff check . --exclude 'tests/fixtures/challenge_mirror'
      - name: challenge_mirror ruff baseline (diff against committed baseline, fail on NEW)
        run: |
          ruff check tests/fixtures/challenge_mirror/ --output-format=concise 2>&1 | grep "^tests/fixtures/challenge_mirror/" | sort >/tmp/mirror-current.txt || true
          sort tests/fixtures/challenge_mirror/.ruff-baseline.txt >/tmp/mirror-baseline.txt
          NEW=$(comm -13 /tmp/mirror-baseline.txt /tmp/mirror-current.txt)
          if [ -n "$NEW" ]; then
            echo "=== NEW challenge_mirror ruff findings (failing build) ===" && echo "$NEW"
            exit 1
          fi
          echo "challenge_mirror ruff baseline OK — no new findings"
      - name: no direct fetcher construction outside factory
        run: |
          HITS=$(grep -rn "Level1Fetcher(\|Level2Fetcher(\|Level3Fetcher(" --include="*.py" . \
            | grep -v "fetcher/factory.py" | grep -v "fetcher/level_1.py" \
            | grep -v "fetcher/level_2.py" | grep -v "fetcher/level_3.py" \
            | grep -v "tests/" || true)
          if [ -n "$HITS" ]; then
            echo "Direct fetcher construction found outside fetcher/factory.py:"
            echo "$HITS"
            exit 1
          fi
          echo "OK — all production fetcher construction goes through fetcher/factory.py"
      - name: force_engine test-seam never reachable from production
        run: |
          HITS=$(grep -rn "force_engine=" --include="*.py" . \
            | grep -v "fetcher/level_2.py" | grep -v "tests/" || true)
          if [ -n "$HITS" ]; then
            echo "force_engine passed outside fetcher/level_2.py + tests/ (production reachability!):"
            echo "$HITS"
            exit 1
          fi
          echo "OK — force_engine test seam has zero production call sites"
      - name: mypy strict (baseline now empty — any error fails the build)
        run: |
          mypy src/scraper_engine/core/ src/scraper_engine/proxy/ src/scraper_engine/orchestrator/ src/scraper_engine/api/ src/scraper_engine/storage/ src/scraper_engine/fetcher/ src/scraper_engine/browser/ src/scraper_engine/observability/ --ignore-missing-imports >/tmp/mypy.out 2>&1 || true
          grep "^[^ ]*:[0-9]*: error:" /tmp/mypy.out | sort >/tmp/mypy-current.txt
          sort tools/mypy-baseline.txt >/tmp/baseline-sorted.txt
          echo "=== Current findings ===" && cat /tmp/mypy-current.txt
          NEW=$(comm -13 /tmp/baseline-sorted.txt /tmp/mypy-current.txt)
          if [ -n "$NEW" ]; then
            echo "=== NEW mypy errors (failing build) ===" && echo "$NEW"
            exit 1
          fi
          FIXED=$(comm -23 /tmp/baseline-sorted.txt /tmp/mypy-current.txt)
          if [ -n "$FIXED" ]; then
            echo "=== FIXED findings (update baseline) ===" && echo "$FIXED"
          fi
          echo "mypy ratchet OK — no regressions"
      - name: mypy baseline shrinkage (advisory — warns, never fails)
        run: bash tools/check_baseline_shrinkage.sh

  unit:
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Install dependencies
        run: |
          pip install -r requirements-dev-lock.txt
          pip install -e . --no-deps
      - run: python -m pytest tests/unit/ -v --tb=short

  integration:
    runs-on: ubuntu-24.04
    needs: unit
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scraper_engine
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: scraper
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@localhost:5432/scraper_engine
      REDIS_URL: redis://localhost:6379/0
      PGBOUNCER_DSN: postgresql://scraper:scraper@localhost:5432/scraper_engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      # postgres/redis run as GH Actions `services:` above; minio has no
      # equivalent here (tests/integration/test_s3_client.py and
      # test_api_main.py, round 28, need a real S3-compatible endpoint) —
      # GH Actions service containers can't override a container's CMD, and
      # minio's image requires `server /data`, so it's brought up via the
      # project's own docker-compose instead, same reasoning as the chaos
      # job's pgbouncer.
      - name: Start minio
        run: docker compose up -d minio
      - name: Wait for minio to accept connections
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/9000) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "minio never came up on :9000"
          docker compose logs minio
          exit 1
      - name: Install dependencies
        run: |
          pip install -r requirements-dev-lock.txt
          pip install -e . --no-deps
      - run: alembic upgrade head
      - run: python -m pytest tests/integration/ -v --tb=short

  chaos:
    runs-on: ubuntu-24.04
    needs: integration
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@localhost:5432/scraper_engine
      REDIS_URL: redis://localhost:6379/0
      PGBOUNCER_DSN: postgresql://scraper:scraper@localhost:6432/scraper_engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      # G-05 needs the *real* PgBouncer (transaction pooling, SCRAM auth off
      # a live pg_authid) — a bare postgres/redis service-container pair can't
      # produce that, so this job brings up the project's own docker-compose
      # infra instead of GH Actions `services:`. pgbouncer's `depends_on:
      # pgbouncer-init: condition: service_completed_successfully` means the
      # SCRAM userlist is already generated by the time this command returns.
      # minio is included because tests/integration/test_s3_client.py (round
      # 28) needs a real S3-compatible endpoint at localhost:9000.
      - name: Start postgres, redis, pgbouncer, minio (real infra for G-05 + S3Client)
        run: docker compose up -d postgres redis pgbouncer minio
      - name: Wait for pgbouncer to accept connections
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/6432) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "pgbouncer never came up on :6432"
          docker compose logs pgbouncer-init pgbouncer
          exit 1
      - name: Install dependencies
        run: |
          pip install -r requirements-dev-lock.txt
          pip install -e . --no-deps
      - run: alembic upgrade head
      # Real coverage gate (round 28): this job runs last with full infra up
      # (postgres/redis/pgbouncer), so it's where the combined unit+
      # integration+chaos suite is actually run with --cov and enforced —
      # fail_under=100 in pyproject.toml was previously dead config that no
      # `pytest` invocation in this file ever passed --cov to.
      - run: python -m pytest tests/unit/ tests/integration/ tests/chaos/ -v --tb=short --cov=src/scraper_engine --cov-report=term-missing --cov-report=xml --cov-fail-under=100

  # Builds and publishes the image CI has been proving works — only on a real
  # merge to main (never on pull_request, so a fork PR never gets registry
  # write access), and only after every test job is green. No live deploy
  # target exists yet (no k8s/systemd/cloud config anywhere in the repo), so
  # this stops at "publish the image", not "deploy it".
  build-and-push:
    runs-on: ubuntu-24.04
    needs: chaos
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
