name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff mypy
      # challenge-mirror excluded here — linted separately against its own
      # committed baseline in the next step (same pattern as tools/mypy-baseline.txt).
      - run: ruff check . --exclude 'challenge-mirror' --exclude 'report-review-fix'
      - name: challenge-mirror ruff baseline (diff against committed baseline, fail on NEW)
        run: |
          ruff check challenge-mirror/ --output-format=concise 2>&1 | grep "^challenge-mirror/" | sort >/tmp/mirror-current.txt || true
          sort challenge-mirror/.ruff-baseline.txt >/tmp/mirror-baseline.txt
          NEW=$(comm -13 /tmp/mirror-baseline.txt /tmp/mirror-current.txt)
          if [ -n "$NEW" ]; then
            echo "=== NEW challenge-mirror ruff findings (failing build) ===" && echo "$NEW"
            exit 1
          fi
          echo "challenge-mirror ruff baseline OK — no new findings"
      - name: no direct fetcher construction outside factory
        run: |
          HITS=$(grep -rn "Level1Fetcher(\|Level2Fetcher(\|Level3Fetcher(" --include="*.py" . \
            | grep -v "fetcher/factory.py" | grep -v "fetcher/level_1.py" \
            | grep -v "fetcher/level_2.py" | grep -v "fetcher/level_3.py" \
            | grep -v "tests/" || true)
          if [ -n "$HITS" ]; then
            echo "Direct fetcher construction found outside fetcher/factory.py:"
            echo "$HITS"
            exit 1
          fi
          echo "OK — all production fetcher construction goes through fetcher/factory.py"
      - name: force_engine test-seam never reachable from production
        run: |
          HITS=$(grep -rn "force_engine=" --include="*.py" . \
            | grep -v "fetcher/level_2.py" | grep -v "tests/" || true)
          if [ -n "$HITS" ]; then
            echo "force_engine passed outside fetcher/level_2.py + tests/ (production reachability!):"
            echo "$HITS"
            exit 1
          fi
          echo "OK — force_engine test seam has zero production call sites"
      - name: mypy ratchet (fails only on NEW type errors beyond committed baseline)
        run: |
          mypy core/ proxy/ orchestrator/ api/ storage/ --ignore-missing-imports >/tmp/mypy.out 2>&1 || true
          grep "^[^ ]*:[0-9]*: error:" /tmp/mypy.out | sort >/tmp/mypy-current.txt
          sort tools/mypy-baseline.txt >/tmp/baseline-sorted.txt
          echo "=== Current findings ===" && cat /tmp/mypy-current.txt
          NEW=$(comm -13 /tmp/baseline-sorted.txt /tmp/mypy-current.txt)
          if [ -n "$NEW" ]; then
            echo "=== NEW mypy errors (failing build) ===" && echo "$NEW"
            exit 1
          fi
          FIXED=$(comm -23 /tmp/baseline-sorted.txt /tmp/mypy-current.txt)
          if [ -n "$FIXED" ]; then
            echo "=== FIXED findings (update baseline) ===" && echo "$FIXED"
          fi
          echo "mypy ratchet OK — no regressions"
      - name: mypy baseline shrinkage (advisory — warns, never fails)
        run: bash tools/check_baseline_shrinkage.sh

  unit:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: |
          pip install \
            fastapi uvicorn pydantic pydantic-core httpx scrapling \
            asyncpg redis rq camoufox structlog prometheus-client \
            pyyaml boto3 python-dotenv \
            pytest pytest-asyncio pytest-cov
          pip install -e . --no-deps
      - run: python -m pytest tests/unit/ -v --tb=short

  integration:
    runs-on: ubuntu-24.04
    needs: unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scraper_engine
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: scraper
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@localhost:5432/scraper_engine
      REDIS_URL: redis://localhost:6379/0
      PGBOUNCER_DSN: postgresql://scraper:scraper@localhost:5432/scraper_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: |
          pip install \
            fastapi uvicorn pydantic pydantic-core httpx scrapling \
            asyncpg redis rq camoufox structlog prometheus-client \
            pyyaml boto3 python-dotenv fakeredis \
            pytest pytest-asyncio pytest-cov alembic sqlalchemy
          pip install -e . --no-deps
      - run: alembic upgrade head
      - run: python -m pytest tests/integration/ -v --tb=short --ignore=tests/integration/test_promotion.py

  chaos:
    runs-on: ubuntu-24.04
    needs: integration
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scraper_engine
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: scraper
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://scraper:scraper@localhost:5432/scraper_engine
      REDIS_URL: redis://localhost:6379/0
      PGBOUNCER_DSN: postgresql://scraper:scraper@localhost:5432/scraper_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: |
          pip install \
            fastapi uvicorn pydantic pydantic-core httpx scrapling \
            asyncpg redis rq camoufox structlog prometheus-client \
            pyyaml boto3 python-dotenv fakeredis \
            pytest pytest-asyncio pytest-cov alembic sqlalchemy
          pip install -e . --no-deps
      - run: alembic upgrade head
      - run: python -m pytest tests/chaos/ -v --tb=short --ignore=tests/chaos/test_pgbouncer_search_path_isolation.py
