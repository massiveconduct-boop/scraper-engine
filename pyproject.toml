[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-engine"
version = "1.0.0"
description = "Search & Scraper Engine — multi-level web scraping with anti-detection"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "httpx==0.28.1",
    "scrapling==0.4.11",
    # scrapling.fetchers.AsyncFetcher/Fetcher (fetcher/scrapling_wrapper.py)
    # import curl_cffi directly at module scope — without it,
    # scrapling.fetchers is entirely unimportable (round 28: found while
    # live-testing scrapling_wrapper.py's real production wiring; not caught
    # earlier since bs4-based selector code never touches scrapling.fetchers).
    # scrapling's own "fetchers" extra also pulls this in, but bundled with
    # playwright==1.61.0 (exact), which conflicts with camoufox==0.5.4's
    # playwright<1.61 — declared directly instead, same as every other
    # direct-import dependency in this list, to get exactly what's needed
    # without the extra's browser-automation stack (StealthyFetcher/
    # DynamicFetcher, unused here) or its playwright pin conflict.
    "curl_cffi>=0.15.0",
    "asyncpg==0.31.0",
    "redis==8.0.1",
    "rq==2.10.0",
    "camoufox==0.5.4",
    "botasaurus==4.0.97",
    # Round 26: imported directly by services/botasaurus_requests_client.py
    # for L1's JA3-matched client — was already a transitive dep of
    # botasaurus itself, declared directly here per the same reasoning as
    # every other direct-import dependency in this list (avoids the drift
    # this list exists to prevent — see .claude/knowledge/operations.md #12).
    "botasaurus-requests==4.0.38",
    # Round 28: imported by proxy/harvester.py's subprocess-broker fallback
    # (`from proxybroker2 import Broker`) but was undeclared here — only
    # worked because it happened to already be pip-installed in this venv.
    # Same "config exists, nothing enforces it" bug class as the rest of
    # this round; see .claude/knowledge/operations.md #12.
    "proxybroker2==2.0.0a4",
    "structlog==26.1.0",
    "prometheus-client==0.25.0",
    "pyyaml==6.0.3",
    "boto3==1.43.52",
    "python-dotenv==1.2.2",
    "scrapy==2.17.0",
    # Runs api + the 3 self-healing daemons (harvester, dlq-reaper,
    # webhook-sweeper) as one supervised container — see docker/supervisord.conf.
    # supervisor still imports pkg_resources internally, which python:3.12-slim
    # no longer bundles by default -- setuptools has to be an explicit runtime
    # dependency, not just a [build-system] one, or supervisord crashloops.
    # Pinned <81: setuptools removed the pkg_resources module entirely in
    # that release, which supervisor (last released 2022) never adapted to.
    "supervisor==4.2.5",
    "setuptools>=68,<81",
    # Round 33: local HTML->markdown fallback (services/markdown_fallback.py)
    # so FetchResult.markdown is populated even when Firecrawl isn't
    # configured (FIRECRAWL_API_KEY/FIRECRAWL_BASE_URL both unset) — see
    # that module's docstring.
    "markdownify==1.2.3",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-asyncpg==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
]

[project.scripts]
scraper-engine = "scraper_engine.cli.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scraper_engine*"]

[tool.setuptools.package-data]
scraper_engine = ["py.typed"]
"scraper_engine.config" = ["*.yaml"]
infra = ["pgbouncer/*.ini"]
monitoring = ["alerts/*.yml", "dashboards/*.json"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
    "mypy==2.3.0",
    "pre-commit>=3.6.0",
    "types-pyyaml>=6.0.0",
    # Migration tooling + test-only fakes — never imported from src/, only
    # from migrations/ and tests/ (round 28: previously hand-listed a 3rd
    # time per CI job instead of declared here, see operations.md #12).
    "alembic==1.18.5",
    "sqlalchemy==2.0.51",
    "fakeredis==2.36.2",
    "pip-audit>=2.7.0",
    # tests/load/locustfile.py only.
    "locust==2.46.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
exclude = ["tests/fixtures/challenge_mirror", ".venv", ".git", ".wolf", ".claude", ".local"]
ignore = ["UP042"]  # str+Enum pattern matches spec; StrEnum changes Pydantic serialization

[tool.ruff.lint.isort]
known-first-party = ["scraper_engine"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["no-untyped-def", "no-untyped-call", "misc"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# No py.typed marker, so mypy fully analyzes their installed source instead of
# treating them as untyped (ignore_missing_imports only covers modules it
# can't find at all) — same shape as the numpy override above.
module = "opentelemetry.instrumentation.*"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: unit tests (no I/O)",
    "integration: integration tests (real DB/Redis)",
    "chaos: resource exhaustion and race condition tests",
    "live: live tests against owned/consented targets (BD-05)",
    "slow: tests that take >5 seconds",
]

[tool.coverage.run]
# Round 62 — branch coverage on. Line coverage alone reported 100% while 33
# decision branches inside those same "100%" files had never been taken one
# way (see .claude/knowledge/technical-debt.md round 62, coverage audit).
# The 100%-lines guarantee is NOT relaxed by this: tools/check_coverage_
# ratchet.py still fails on a single missed line, and additionally holds
# missing branches to a budget that may only ever shrink.
branch = true
source = ["src/scraper_engine/core", "src/scraper_engine/proxy", "src/scraper_engine/browser", "src/scraper_engine/fetcher", "src/scraper_engine/services", "src/scraper_engine/storage", "src/scraper_engine/orchestrator", "src/scraper_engine/api"]

[tool.coverage.report]
# Per-spec §10, round 28: CI gate enforces 100% across every package in
# [tool.coverage.run] source except browser/, which needs a real Firefox
# process (~80MB RSS, not available in CI runners) and is measured only
# where possible (session_state, pool init) without being gated.
# Round 62 — with branch=true the combined figure is ~99.33%, so this is a
# coarse safety net only. The REAL gate is tools/check_coverage_ratchet.py,
# which enforces zero missed LINES (no tolerance, same as before) plus a
# shrinking absolute budget for missed branches. A percentage alone cannot
# express "100% of lines AND at most N branches", and lowering it to 99
# without the ratchet would silently start tolerating ~33 missed lines.
fail_under = 99
include = ["src/scraper_engine/core/*", "src/scraper_engine/proxy/*", "src/scraper_engine/orchestrator/*", "src/scraper_engine/fetcher/*", "src/scraper_engine/services/*", "src/scraper_engine/storage/*", "src/scraper_engine/api/*"]
