[databases]
scraper_engine = host=postgres port=5432 dbname=scraper_engine

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer-config/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 5.0
server_idle_timeout = 600
client_idle_timeout = 0
server_lifetime = 3600
server_connect_timeout = 15
log_connections = 1
log_disconnections = 1
stats_period = 60

# Tenant-scoped connection management:
# asyncpg pool → PgBouncer (transaction mode) → PostgreSQL
# Each tenant gets SET search_path per checkout, not a separate pool.
