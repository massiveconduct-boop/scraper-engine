# monitoring/alertmanager/alertmanager.yml
# Alertmanager configuration — routes Prometheus alerts to Slack.
#
# Plan §3.3: two-tier routing. Default channel for all alerts,
# critical channel with 30m repeat. PagerDuty alternative commented.
#
# SLACK_WEBHOOK_URL goes in .env, never committed (plan §3.3).
# The docker-entrypoint.sh wrapper substitutes the env var at container start.
#
# Alertmanager v0.33.1 requires slack_api_url at global level for the
# Slack integration to activate. Per-receiver api_url is not sufficient.
# Channel differentiation is handled per-receiver; the global URL is
# shared across both receivers (same webhook, different channels).

global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: paging-channel
      repeat_interval: 30m   # critical alerts nag more often than default

receivers:
  - name: default
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: paging-channel
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: '🚨 {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
    # --- PagerDuty alternative, use instead of/alongside slack_configs above ---
    # pagerduty_configs:
    #   - service_key: '${PAGERDUTY_SERVICE_KEY}'
    #     description: '{{ .CommonAnnotations.summary }}'

inhibit_rules:
  # Suppress warnings when the same alertname fires as critical
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
