# monitoring/alerts/prometheus_rules.yml
# Prometheus alert rules — spec §9 observability
groups:
  - name: scraper_engine
    rules:
      # Proxy pool critical low — fires when validated proxy count drops below minimum.
      # Uses proxy_pool_validated_count gauge (observability/metrics.py) updated
      # by harvester after each cycle. Threshold: <5 validated proxies.
      - alert: ProxyPoolCriticallyLow
        expr: proxy_pool_validated_count < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Validated proxy pool (score>=40) critically low — escalations may fail"
          description: "Validated proxy count is {{ $value }}. Minimum safe threshold is 5. Updated by harvester after each cycle."

      # BrowserPoolExhausted removed (round 25): BrowserPool now lives inside the
      # rq work-horse process for one job's lifetime (see orchestrator/tasks.py —
      # rq forks a fresh process per job that os._exit()s right after). That
      # process never serves /metrics and is gone before the next Prometheus
      # scrape could ever see it — a browser_pool_size gauge set there would be
      # the same "looks wired, never actually reaches Prometheus" failure this
      # round exists to close. Revisit only if BrowserPool's lifetime changes
      # (e.g. a persistent worker pool instead of per-job forking).

      # Circuit breaker tripped repeatedly — possible misconfiguration.
      # circuit_breaker_trips_total is a global counter (round 25) — Redis has
      # no cheap way to enumerate every domain a breaker has tripped for, so
      # this can't carry a domain label; it still catches a misconfigured
      # cooldown causing frequent trips overall.
      - alert: CircuitBreakerFrequentTrips
        expr: rate(circuit_breaker_trips_total[1h]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker tripped >5x/hour across all domains — cooldown backoff likely misconfigured"
          description: "{{ $value }} circuit trips in the last hour (all domains combined)."

      # Dead letter queue growing — jobs accumulating without resolution
      - alert: DeadLetterQueueGrowing
        expr: dlq_size > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Dead letter queue has {{ $value }} entries — jobs accumulating"
          description: "More than 100 jobs in the DLQ. Investigate failure patterns."

      # CapSolver budget near ceiling. Per-tenant now (round 25 — the ceiling
      # used to be one hardcoded global $1.00/day; tenants.capsolver_daily_credit_ceiling
      # is read per tenant), so divide by the matching per-tenant ceiling gauge
      # instead of the old hardcoded 1.0.
      - alert: CapSolverBudgetExhausted
        expr: capsolver_daily_spend / capsolver_daily_ceiling > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CapSolver daily budget at {{ $value | humanizePercentage }} for tenant {{ $labels.tenant_id }}"
          description: "Tenant {{ $labels.tenant_id }}'s CapSolver spend is nearing its daily ceiling. New solves for this tenant will be rejected."

      # Proxy exhaustions increasing — harvester may be failing. Labeled by
      # level only (round 25) — level is a small fixed set {1,2,3}, domain is
      # not (unbounded-cardinality label removed).
      - alert: ProxyExhaustionRateHigh
        expr: rate(proxy_exhausted_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Proxy pool exhaustion rate elevated: {{ $value }}/s"
          description: "Level {{ $labels.level }} failing to find proxies at an elevated rate."

      # High job failure rate. job_duration_seconds_count/_sum are Redis-backed
      # gauges (round 25) — see observability/metrics.py for why (rq forks a
      # fresh process per job that exits right after, so an in-process
      # Histogram would never be scraped).
      - alert: HighJobFailureRate
        expr: |
          (
            sum(rate(job_duration_seconds_count{status="failed"}[10m]))
            /
            sum(rate(job_duration_seconds_count[10m]))
          ) > 0.5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Job failure rate above 50% in the last 10 minutes"
          description: "{{ $value | humanizePercentage }} of jobs are failing. Check target availability and proxy health."

      # API error rate. http_requests_total wired round 25 — see
      # observability/middlewares/http_metrics.py.
      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate elevated"
          description: "{{ $value }}/s 5xx errors in the last 5 minutes."

      # PgBouncer connection pool near limit. Round 25: no code anywhere talked
      # to PgBouncer's admin console, so this was a dead metric referencing
      # names nothing emitted — fixed via the pgbouncer_exporter sidecar added
      # to docker-compose.yml (reads real SHOW POOLS/SHOW CONFIG state) rather
      # than hand-rolling an admin-console client in this app. Metric names
      # below match prometheuscommunity/pgbouncer-exporter's documented output;
      # per this round's own plan, confirm with
      # `curl pgbouncer_exporter:9127/metrics` against the exporter version
      # actually deployed before trusting this in production.
      - alert: PgBouncerPoolNearLimit
        expr: pgbouncer_pools_client_active_connections / pgbouncer_config_max_client_conn > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PgBouncer pool at {{ $value | humanizePercentage }} capacity"
          description: "Connection pool near limit (BD-06: max_client_conn=500). Consider scaling."

      # Redis unreachable
      - alert: RedisUnreachable
        expr: up{job="scraper-engine"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scraper engine metrics endpoint unreachable"
          description: "Prometheus cannot scrape metrics from scraper-engine. Service may be down."

      # ── Round 13 D1: watch a previously-disclosed-but-unwatched code path ──
      - alert: SafeContentGuardFiringFrequently
        expr: rate(safe_content_none_total[1h]) > 0.1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Level3Fetcher's _safe_content guard is firing more than incidentally"
          description: "This was a theoretical, untested code path (round 12.4). A sustained
            nonzero rate means it's firing for real — investigate which targets are triggering
            the mid-navigation race before assuming the guard alone is sufficient."

      # ── Round 13 D2: per-source proxy health, not just aggregate pool count ──
      - alert: ProxySourceWentDark
        expr: proxy_source_healthy == 0
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.source_name }} has returned zero proxies for 6+ hours"
          description: "One of the (already small) pool of independent proxy sources appears to
            be dead. Check if it needs replacing per the round-6/6.1 diversity work — this is
            exactly the class of silent single-source failure that motivated that work."
